name: Rust CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - 'examples/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'AGENTS.md'
      - '.agents/skills/**'
      - 'CONTRIBUTING.md'
      - 'docs/TESTING.md'
      - '.prototools'
      - '.moon/**'
      - 'moon.yml'
      - '.dockerignore'
      - '.github/workflows/rust-ci.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - 'examples/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'AGENTS.md'
      - '.agents/skills/**'
      - 'CONTRIBUTING.md'
      - 'docs/TESTING.md'
      - '.prototools'
      - '.moon/**'
      - 'moon.yml'
      - '.dockerignore'
      - '.github/workflows/rust-ci.yaml'

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format check (runs once for entire workspace)
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: rustfmt
          profile: minimal
          cache-shared-key: rust-ci-1.90
          cache-workspace-crates: true
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Per-crate quality checks (parallel)
  crate-checks:
    name: ${{ matrix.crate }} - Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - gear-mesh
          - gear-mesh-core
          - gear-mesh-derive
          - gear-mesh-generator
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: clippy
          profile: minimal
          cache-shared-key: rust-ci-1.90
          cache-key: ${{ matrix.crate }}
          cache-workspace-crates: true
      
      - name: Clippy
        run: cargo clippy --package ${{ matrix.crate }} --all-targets --all-features -- -D warnings
      
      - name: Test
        run: cargo test --package ${{ matrix.crate }} --all-features
      
      - name: Doc
        run: cargo doc --package ${{ matrix.crate }} --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Same standard verification entrypoint used locally, including generated TS.
  integration:
    name: Standard Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
          profile: minimal
          cache-shared-key: rust-ci-1.90
          cache-key: integration
          cache-workspace-crates: true
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install pinned npm version
        run: npm install --global npm@10.9.0

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run standard verification
        run: npm test

  # Exercise the optional local Docker path on a clean Linux runner too.
  docker:
    name: Docker Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run standard verification in Docker
        run: bash tests/e2e/run-docker-test.sh

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          profile: minimal
          cache-shared-key: rust-ci-1.90
          cache-key: security
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: cargo audit

  # Dependency checks
  dependencies:
    name: Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          profile: minimal
          cache-shared-key: rust-ci-1.90
          cache-key: dependencies
      
      - name: Install cargo-deny
        run: cargo install cargo-deny
      
      - name: Check licenses and advisories
        run: cargo deny check
